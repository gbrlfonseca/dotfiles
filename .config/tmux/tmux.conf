# Generated by tmux.app Config Generator
# https://tmux.app/config-generator/

# ── Prefix Key ──────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-right " %H:%M %d-%b "

# ── Terminal Colors ──────────────────────
set -g default-terminal "${TERM}"
set -ga terminal-overrides ",*:RGB"

# ── Pane Borders ─────────────────────────
# pane-border-lines needs tmux 3.2+
set -g pane-border-lines heavy
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#bb9af7"

# ── Theme (via TPM) ──────────────────────
# Dracula Theme
set -g @plugin 'dracula/tmux'
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage"

# ── TPM Plugin Manager ───────────────────
# Install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Keep the run line at the very bottom of this file.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'
